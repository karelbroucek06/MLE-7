[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Reminder e-maily — každý den v 8:00 UTC (9:00 CET / 10:00 CEST) ──
[functions."send-reminders"]
  schedule = "0 8 * * *"

# ── Bezpečnostní hlavičky (celý web) ──────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Admin stránka — blokuj indexaci vyhledávači ───────────────
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# ── Redirect: admin.evo7.cz → /admin.html ─────────────────────
# Netlify musí mít admin.evo7.cz přidané jako domain alias
# Site settings → Domain management → Add domain alias
[[redirects]]
  from       = "/"
  to         = "/admin.html"
  status     = 302
  force      = true
  conditions = { Host = ["admin.evo7.cz"] }
